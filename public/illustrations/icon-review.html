<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tohyee illustration audit</title><style>
:root{font-family:system-ui,sans-serif;color:#233e45;background:#f5f8f4}
body{max-width:1260px;margin:auto;padding:24px}
h1{font-size:2rem;margin:.2rem 0}p{max-width:850px;line-height:1.6}
.controls{display:flex;gap:15px;align-items:center;flex-wrap:wrap;padding:15px 0}
label{display:flex;gap:8px;align-items:center}
section{margin-top:35px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px}
.card{border:1px solid #d8e3d9;border-radius:14px;background:white;padding:12px;display:grid;gap:8px;justify-items:center;min-width:0}
.card img{object-fit:contain}
.card strong{font-size:12px;text-align:center;overflow-wrap:anywhere}
.card code{font-size:10px;color:#5c7275}
.preview{width:100%;height:100px;display:grid;place-items:center;background:#f9fbf9;border-radius:10px}
.small .preview{height:66px}
.dark .preview{background:#263e44}
.dark .card{background:#fff}
a{color:#216956}
</style></head>
<body><h1>Tohyee illustration review</h1>
<p>Review every farm icon beside Tohyee's original general icons. Check the shapes at <strong>28px</strong> (mobile) and <strong>64px</strong> (cards), and against both light and dark surfaces. New farming icons use approved illustrated PNG artwork. Original shared icons remain SVG.</p>
<div class="controls"><label>Size <select id="size"><option value="28">28 px</option><option value="64" selected>64 px</option></select></label><label><input id="dark" type="checkbox">Dark preview background</label><label><input id="onlyNew" type="checkbox">Show new farm icons only</label></div>
<div id="gallery"></div>
<script>
const categories={
"Farm Log": "farm-walk mob-in mob-out cover-reading feed rain-gauge move-mob births deaths treatment hazard near-miss incident irrigation pond-level",
"Farm tabs": "log more",
"Farm menu": "pasture fertiliser rainfall soil-test tractor medicines animal-tag",
"Farm calendar": "stock-truck vet delivery contractor meeting deadline",
"Farm weather": "sun cloud rain wind frost",
"Existing shared icons": "accounting ai analytics approval apps awaiting banking calendar camera card checklist clock coins credit-note crm csv currency database documents duplicates effluent farm flask form funnel inspect inventory jobs key leave livestock location mail maps offline payroll photo pipeline price purchases quad rd-claim reassign receipt reports safety sales scales search sensors settings shop social spreadsheet sync-pending synced tagged-receipt tax-code tax-return tax team vehicle weather"
};
const root=document.getElementById("gallery");const size=document.getElementById("size");const dark=document.getElementById("dark");const onlyNew=document.getElementById("onlyNew");
function render(){
root.innerHTML="";document.body.classList.toggle("dark",dark.checked);document.body.classList.toggle("small",size.value==="28");
for(const [category,names] of Object.entries(categories)){if(onlyNew.checked&&category==="Existing shared icons")continue;
const section=document.createElement("section");const h=document.createElement("h2");h.textContent=category+" ("+names.split(" ").length+")";section.append(h);
const grid=document.createElement("div");grid.className="grid";
for(const name of names.split(" ")){
const card=document.createElement("div");card.className="card";
const preview=document.createElement("div");preview.className="preview";
const img=document.createElement("img");const extension=".svg";img.src="./icons/"+name+extension;img.width=+size.value;img.height=+size.value;img.alt=name.replaceAll("-"," ");
img.addEventListener("error",()=>{card.style.borderColor="#bf594c"});
preview.append(img);const label=document.createElement("strong");label.textContent=name.replaceAll("-"," ");const code=document.createElement("code");code.textContent=name+extension;
card.append(preview,label,code);grid.append(card)}
section.append(grid);root.append(section)}
}
[size,dark,onlyNew].forEach(input=>input.addEventListener("change",render));render();
</script></body></html>

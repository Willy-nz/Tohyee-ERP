name: Release server bundle

# Pushing a v* tag (matching package.json's version) publishes a release with:
# - tohyee-v<version>-windows-docker.zip: Docker Desktop installer for Windows
# - tohyee-v<version>-linux-x64.tar.gz: the plain Node.js bundle
# and the Docker images ghcr.io/willy-nz/tohyee:<version> and
# ghcr.io/willy-nz/tohyee-postbox:<version>, the camera post box
# (postbox/Dockerfile). Their :latest tags move only when the whole release
# is ready (scripts/promote-release.sh, run by each release build).
#
# The token is read-only by default. The build job runs npm ci (third-party
# install scripts) with no write access; the image job can push packages
# only; the publish job, which runs none of the repo's code, attaches the
# built files to the release.

# Also run by release-on-version.yml (workflow_dispatch on the new tag),
# because a tag made by the workflow's own token doesn't start workflows.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches package version
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Run this on a v* tag, not a branch."
            exit 1
          fi
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}."
            exit 1
          fi

      - name: Build production app
        run: npm run build

      - name: Package Linux bundle
        run: npm run package:release

      - name: Package Windows installer
        run: node scripts/package-windows.mjs

      - name: Keep the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          if-no-files-found: error
          path: |
            dist/release/*.zip
            dist/release/*.tar.gz
            dist/release/*.sha256

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # The post box image is also built for ARM servers (many cheap ones are).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/willy-nz/tohyee:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/Willy-nz/Tohyee-ERP
            org.opencontainers.image.description=Tohyee: self-hosted, open-source accounting for New Zealand organisations
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Build and push the camera post box image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: postbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/willy-nz/tohyee-postbox:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/Willy-nz/Tohyee-ERP
            org.opencontainers.image.description=Tohyee camera post box: cameras upload here by FTPS, Tohyee collects over HTTPS
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ env.VERSION }}

  # Never replaces a file already on the release (no --clobber): servers
  # update from these files, so a second upload under the same name fails
  # instead. To redo one, delete the asset from the release by hand first.
  publish:
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Get the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist/release

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --latest=false --title "${GITHUB_REF_NAME}" --generate-notes || \
            { sleep 30; gh release view "${GITHUB_REF_NAME}" >/dev/null; }

      - name: Attach files to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/release/*.zip dist/release/*.tar.gz dist/release/*.sha256

      # Only the promote script: nothing that npm or Gradle would run.
      - name: Checkout the promote script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/promote-release.sh
          sparse-checkout-cone-mode: false
          path: promote

      - name: Log in to GitHub Container Registry (to move :latest)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release was made with --latest=false. Whichever build attaches the
      # last file makes it the latest, and moves Docker's :latest with it.
      - name: Make it the latest release once every file is there
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: bash promote/scripts/promote-release.sh

name: Release on version

# Merging a "Release x.y.z" pull request (package.json's version goes up, with
# docs/releases/x.y.z.md) publishes the release: this makes the v<version>
# tag and the GitHub release on that commit, with the notes from the docs,
# then starts the three release builds on the tag (server bundle and Docker
# images, Windows installer, Android app). A tag made with the workflow's own
# token doesn't start workflows by itself, so they're started by hand
# (workflow_dispatch), which it can do.
#
# The release is made with --latest=false: it's public, but GitHub's
# "latest" (what servers update to, Docker's :latest and the website's
# Download) stays on the previous release until all of its files are
# attached. Each build workflow runs scripts/promote-release.sh after
# attaching its files, and the last one makes it the latest.
#
# When the version's tag already exists, only the builds whose files are
# missing from its release are started again (a failed or cancelled build,
# say), so running this by hand (Actions > Release on version > Run
# workflow, on main) finishes a half-made release. Pushing a tag by hand
# still works as before.
#
# It runs none of the repo's code: it only reads package.json and the notes.

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-on-version
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version and tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(jq -r .version package.json)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "package.json's version \"${version}\" isn't x.y.z."
            exit 1
          fi
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::notice title=Already released::${tag} already exists: only builds whose files are missing are started."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Make the tag and the release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes="docs/releases/${VERSION}.md"
          if [ ! -f "$notes" ]; then
            echo "No release notes at ${notes}: add them in the release pull request."
            exit 1
          fi
          # Not the latest until every file is there (scripts/promote-release.sh).
          gh release create "$TAG" --target "$GITHUB_SHA" --latest=false \
            --title "Tohyee ${TAG}" --notes-file "$notes"

      - name: Start the release builds (only those whose files are missing)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! have="$(gh release view "$TAG" --json assets --jq '.assets[].name')"; then
            echo "There's no release for ${TAG}: make it (or delete the tag) first."
            exit 1
          fi
          has() { grep -qxF "$1" <<<"$have"; }
          started=0
          # Starts a build unless one is already running or waiting on this tag.
          start() {
            running="$(gh run list --workflow "$1" --branch "$TAG" --json status --jq '[.[] | select(.status != "completed")] | length')"
            if [ "${running:-0}" != "0" ]; then
              echo "$1 is already running for ${TAG}."
              return
            fi
            gh workflow run "$1" --ref "$TAG"
            started=$((started + 1))
          }
          if ! has "tohyee-v${VERSION}-linux-x64.tar.gz.sha256" || ! has "tohyee-v${VERSION}-windows-docker.zip.sha256"; then
            start release-server-bundle.yml
          fi
          if ! has "TohyeeSetup-${VERSION}.exe.sha256"; then
            start windows-installer.yml
          fi
          if ! has "Tohyee-${VERSION}.apk" && ! has "Tohyee-${VERSION}-test.apk"; then
            start android-app.yml
          fi
          echo "Started ${started} release build(s) for ${TAG}."
